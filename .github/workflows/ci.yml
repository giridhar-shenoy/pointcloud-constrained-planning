name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write  # docker layer cache (type=gha)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: pcp:ci
  # Every in-container step runs in ONE long-lived container (started below), so packages that
  # rosdep installs survive into the build and test steps. The image's entrypoint script sources
  # /opt/ros/lyrical and, once it exists, /ws/install.
  RUN_IN: docker exec pcp /usr/local/bin/pcp-entrypoint.sh

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python for linters
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint (pre-commit)
        run: |
          python -m pip install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image from Dockerfile (apt layers cached in the GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the CI container (workspace bind-mounted at /ws)
        run: >-
          docker run -d --name pcp --user root -e HOME=/root -e CI=true
          -e ROS_DOMAIN_ID=12 -e GZ_PARTITION=r2 -e MAKEFLAGS=-j4
          -v ${{ github.workspace }}:/ws -w /ws --entrypoint sleep ${{ env.IMAGE }} infinity

      - name: rosdep install
        run: >-
          $RUN_IN bash -c "apt-get update -qq && rosdep update --rosdistro lyrical -q &&
          rosdep install --from-paths src --ignore-src -y --rosdistro lyrical"

      - name: colcon build
        run: >-
          $RUN_IN bash -c "colcon build --symlink-install --parallel-workers 2
          --cmake-args -DCMAKE_BUILD_TYPE=Release"

      - name: colcon test
        run: >-
          $RUN_IN bash -c "colcon test --parallel-workers 1 --event-handlers console_direct+ &&
          colcon test-result --verbose"

      - name: Python unit tests (aggregation)
        run: $RUN_IN bash -c "python3 -m pytest -q scripts/tests"

      # v0.2 adds the collision agreement (MoveIt's scene vs the direct Pinocchio/coal checker) on
      # the first 50 of the seed-0 configurations to the smoke path; no Gazebo needed for it.
      # It must agree on all 50 and both checkers must test the same pair set.
      - name: ci_smoke (sim + octomap + one RRTConnect plan, 240 s cap) + collision agreement (50)
        run: >-
          $RUN_IN bash -c "scripts/ci_smoke.sh &&
          scripts/collision_agreement.sh 50 results/tmp/ci_agreement50.csv 0 &&
          python3 -c \"import json, sys; m = json.load(open('results/tmp/ci_agreement50.csv.meta.json'));
          sys.exit(0 if m['agree'] == m['count'] == 50 and m['pair_sets_equal'] else 1)\""

      - name: Mini-benchmark (5 queries x {none, orientation}, < 5 min)
        timeout-minutes: 5
        run: >-
          $RUN_IN bash -c "scripts/bench_planners.sh 5 results/tmp/ci_bench5.csv &&
          test \$(( \$(wc -l < results/tmp/ci_bench5.csv) - 1 )) -eq 10 &&
          python3 scripts/aggregate.py --csv results/tmp/ci_bench5.csv --print-only"

      - name: Direct-vs-MoveIt mini-benchmark (5 queries, plan only, no Gazebo, < 3 min)
        timeout-minutes: 3
        run: >-
          $RUN_IN bash -c "scripts/bench_direct.sh 5 results/tmp/ci_direct5.csv --plan-only &&
          test \$(( \$(wc -l < results/tmp/ci_direct5.csv) - 1 )) -eq 10 &&
          python3 scripts/aggregate_direct.py --csv results/tmp/ci_direct5.csv --print-only"

      - name: Upload sim logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: log/sim/
          if-no-files-found: ignore
