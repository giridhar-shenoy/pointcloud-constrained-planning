config:
  MD013: false  # line length: prose is wrapped by hand, tables cannot be
  MD033: false  # inline HTML is used for GIF sizing
  MD041: false  # README starts with a badge line after the title
  MD060: false  # table pipe alignment: results tables are generated by scripts
ignores:
  - "build/**"
  - "install/**"
  - "log/**"
