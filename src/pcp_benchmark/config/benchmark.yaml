# Benchmark parameters (feature prompt, SPRINT OVERRIDE MUST scope). Planner parameters live in
# pcp_moveit_config/config/ompl_planning.yaml; nothing planner-related is set in code.
/**:
  ros__parameters:
    bench:
      # queries_file, output_csv, commit, first_query and max_queries are launch arguments of
      # benchmark.launch.py (a `/**` default here would take precedence over the launch values).
      pipeline: ompl
      group: ur_manipulator
      tip_link: tool0
      # RRTConnectRange2 was chosen on the seed-1 tuning set (results/tuning/tuning.csv), never on
      # the seed-0 evaluation queries; see docs/planners.md "How range was chosen".
      planners: [RRTConnectRange2]
      constraints: [none, orientation]
      planning_time: 10.0       # s, per cell
      max_tilt_deg: 5.0         # keep-upright cone half-angle
      repetitions: 1
      ompl_seed: 1             # OMPL replaces seed 0 by 1 (with a warning), so start at 1
      octomap_timeout: 180.0    # s to wait for move_group's octomap
      octomap_settle: 3.0       # s the occupied-voxel count must stay unchanged
    planning_pipelines:
      pipeline_names: [ompl]
